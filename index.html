<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice Room</title>
<style>
/* Visual limpo: fundo neutro escuro, painéis lisos, fonte do sistema. Cor só onde carrega informação
   (tônica, tônica relativa, nota de cor, nota tocando). */
:root {
  --bg: #15171a; --panel: #1d2024; --panel2: #262a2f; --line: #343941;
  --accent: #e0b04a; --accent-soft: rgba(224, 176, 74, .14); --rel: #9c7a33;
  --text: #e8e9eb; --muted: #9aa0a8; --violet: #b18cf0;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
/* a grade fica num contêiner próprio: elementos que extensões do navegador injetam na página não mexem no layout */
#app { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) 270px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "brand brand" "theory metro" "fret fret"; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
h2 { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); margin: 0 0 10px; font-weight: 600; text-transform: uppercase; }
button, select, input[type=number] {
  font-family: var(--sans); font-size: 13px; color: var(--text); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
}
button { cursor: pointer; font-weight: 500; }
button:hover, button:focus-visible, select:focus-visible { border-color: var(--muted); outline: none; }
button.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; padding: 7px 13px; }
button.toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
input[type=range] { accent-color: var(--accent); flex: 1; min-width: 80px; }
input[type=number] { width: 62px; }
.row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 9px; }
label.k { font-size: 12px; color: var(--muted); }

#brand { grid-area: brand; display: flex; align-items: center; gap: 12px; }
#brand b { font-size: 15px; font-weight: 600; letter-spacing: .5px; }

#theory { grid-area: theory; overflow: auto; padding: 14px 16px; }
#theoryBody { columns: 2 300px; column-gap: 28px; }
#theoryBody > * { break-inside: avoid; }
#theory .name { font-size: 20px; font-weight: 600; margin: 12px 0 10px; column-span: all; }
#theory .formula { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
#theory .formula span { font-size: 12px; font-weight: 600; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--accent); color: var(--text); }
#theory .formula span.r { background: var(--accent); color: #1a1406; }
#theory .formula span.rel { background: var(--rel); color: #1a1406; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
#theory .formula span.c { color: var(--violet); border-color: var(--violet); }
.tonics { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin-bottom: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
.tonics i { width: 16px; height: 16px; border-radius: 50%; display: block; }
.tonics i.r { background: var(--accent); }
.tonics i.rel { background: var(--rel); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
.tonics b { font-weight: 600; }
.tonics small { color: var(--muted); font-size: 13px; }
#theory p { line-height: 1.45; margin: 0 0 8px; }
#theory p b { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 4px; }
#theory .tip { border-left: 2px solid var(--line); padding-left: 10px; color: var(--muted); }

#metro { grid-area: metro; overflow: auto; padding: 14px; }
#metro .bpm { font-size: 34px; font-weight: 600; text-align: center; margin: 0; font-variant-numeric: tabular-nums; }
#metro .bpm small { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); font-weight: 500; }
.beats { display: flex; justify-content: center; gap: 10px; margin: 8px 0 12px; }
.beats i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--muted); }
.beats i.on { background: var(--muted); }
.beats i.on.acc { background: var(--accent); border-color: var(--accent); }
.bgtrack { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.bgnow { margin-top: 9px; font-size: 13px; color: var(--muted); }
.bgnow b { color: var(--text); font-size: 14px; font-weight: 600; }
.modemap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 4px 0 6px; }
.modemap button { padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
.modemap button small { font-size: 11px; color: var(--muted); }
.modemap button.parent { border-color: var(--accent); }
.modemap button.cur { background: var(--accent); color: #1a1406; border-color: var(--accent); }
.modemap button.cur small { color: #3a2c0c; }
.maphint { font-size: 13px; line-height: 1.4; margin: 0 0 12px; color: var(--muted); }
.maphint b { color: var(--text); font-weight: 600; }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details[open] summary { margin-bottom: 8px; }

#fretbar { grid-area: fret; margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-top: 1px solid var(--line); }
#fretbar .row.ctl { margin-bottom: 8px; }
.fhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.fhead h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: .3px; }
.fhead h1 b { color: var(--accent); }
#scaleSub { font-size: 14px; color: var(--muted); }
#scaleSub b { color: var(--text); font-weight: 600; }
#fretbar .now { margin-left: auto; font-size: 14px; font-weight: 600; min-width: 110px; text-align: right; }
.fretscroll { overflow-x: auto; }
#fret { display: block; width: 100%; min-width: 720px; height: auto; cursor: pointer; touch-action: manipulation; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 4px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; }
.legend i.r { background: var(--accent); }
.legend i.rel { background: var(--rel); box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--accent); }
.legend i.n { border: 1.5px solid var(--accent); }
.legend i.c { border: 1.5px solid var(--violet); }
.legend span.keys { margin-left: auto; }

.tab { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 2px 0 6px; }
.trow { display: flex; margin-bottom: 4px; }
.tcol { display: flex; flex-direction: column; align-items: stretch; width: 22px; flex: none; }
.tcol b, .tcol i { height: 15px; line-height: 15px; font-size: 11px; text-align: center; font-style: normal; color: var(--muted); white-space: nowrap; overflow: visible; }
.tcol b { color: var(--accent); text-align: left; font-family: var(--sans); font-weight: 600; }
.tcol span { height: 14px; line-height: 14px; text-align: center; background: linear-gradient(#5a616b, #5a616b) center / 100% 1px no-repeat; }
.tcol span em { font-style: normal; background: var(--panel); padding: 0 2px; color: var(--text); font-weight: 600; }
.tcol.lab { width: 38px; }
.tcol.lab i { text-align: right; padding-right: 6px; }
.tcol.lab span { background: none; color: var(--muted); padding-right: 6px; text-align: right; }
.tcol.bar { min-width: 0; width: 13px; }
.tcol.bar span { background: linear-gradient(#5a616b, #5a616b) center / 1.5px 100% no-repeat; }
.tcol.playing span em { background: var(--accent); color: #1a1406; border-radius: 3px; }
.tcol.playing i { color: var(--accent); }
#tabBox summary { margin: 2px 0 4px; }
/* nada muda de altura enquanto toca: nota tocando com largura fixa, nome do arpejo numa linha, dica da visão com 2 linhas reservadas */
#fretbar .now { flex: none; width: 190px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fhead { flex-wrap: nowrap; min-width: 0; }
.fhead h1 { flex: none; white-space: nowrap; }
#scaleSub { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#viewHint { flex-basis: 100%; line-height: 1.35; height: 2.7em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 900px) { #viewHint { height: 5.4em; -webkit-line-clamp: 4; } #fretbar .now { width: 150px; } }
.legend i.o { border: 1.5px dashed #c9ccd1; }
.bgnow small { color: var(--muted); font-size: 12px; }

/* abas Teoria / Curso */
.tabs { display: flex; gap: 4px; margin: -4px 0 12px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px 8px; color: var(--muted);
  font-weight: 600; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.genres button.on { background: var(--accent); color: #1a1406; border-color: var(--accent); }
.genres small { opacity: .7; font-size: 11px; margin-left: 2px; }
.course { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
.llist { display: flex; flex-direction: column; gap: 2px; }
.llist button { text-align: left; background: none; border-color: transparent; display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; line-height: 1.3; }
.llist button.cur { background: var(--panel2); border-color: var(--line); }
.llist .n { flex: none; width: 18px; color: var(--muted); font-size: 12px; text-align: right; }
.llist button.done .n { color: var(--accent); }
.ldetail h3 { font-size: 19px; margin: 2px 0 10px; font-weight: 600; }
.lmeta { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chips span { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.ldetail p, .ldetail li { line-height: 1.5; }
.ldetail ol { margin: 0 0 12px; padding-left: 22px; }
.ldetail li { margin-bottom: 4px; }
.ldetail .goal { border-left: 2px solid var(--accent); padding-left: 10px; }
.ldetail .muted { color: var(--muted); }
.pickrow { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.pickrow select { min-width: 240px; max-width: 100%; }
.who { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; margin: 0 0 12px; }
.who button { font-size: 12px; padding: 3px 9px; border-radius: 999px; }
.items { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.item.cur { border-color: var(--accent); background: var(--panel2); }
.item h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.item h4 small { color: var(--muted); font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; flex: none; }
.item p { margin: 0 0 8px; }
.item .chips { margin-bottom: 8px; }

#theoryBtn { display: none; }
@media (max-width: 900px) {
  .course { grid-template-columns: minmax(0, 1fr); }
  #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "brand" "theory" "fret" "metro"; } /* celular: curso (se aberto) e braço primeiro, metrônomo embaixo */
  #theory { display: none; }
  #theory.open { display: block; }
  #theoryBody { columns: 1; }
  #theoryBtn { display: inline-block; }
  .legend span.keys { display: none; }
}
</style>
</head>
<body>
<div id="app">
<div id="brand"><b>Practice Room</b> <button id="theoryBtn">Theory &amp; Course</button></div>

<div id="theory" class="glass">
  <div class="tabs"><button data-tab="theory">Scale &amp; Theory</button><button data-tab="course">Course</button></div>
  <div id="paneTheory">
    <div class="row"><select id="key" aria-label="Key"></select><select id="scale" aria-label="Scale"></select></div>
    <div id="theoryBody"></div>
  </div>
  <div id="paneCourse" hidden></div>
</div>

<div id="metro" class="glass">
  <div class="bgtrack"><h2>Background</h2>
    <div class="row"><button class="primary" id="padOn">▶ Play</button><input type="range" id="padVol" min="0" max="100" value="50" aria-label="Background volume"></div>
    <div class="bgnow" id="bgNow"></div>
  </div>
  <h2>Metronome</h2>
  <div class="bpm"><span id="bpmShow">60</span> <small>BPM</small></div>
  <div class="beats" id="beats"></div>
  <div class="stack">
    <div class="row"><button class="primary" id="play">▶ Start</button><button id="tap">Tap</button><button class="toggle on" id="clickOn">Bell</button></div>
    <div class="stack more">
      <input type="range" id="bpm" min="0" max="100" value="60" aria-label="Tempo">
      <div class="row">
        <select id="sig" aria-label="Time signature"><option value="4">4/4</option><option value="3">3/4</option><option value="6">6/8</option><option value="5">5/4</option><option value="7">7/8</option></select>
        <select id="subdiv" aria-label="Note value"><option value="1">Quarters</option><option value="2" selected>Eighths</option><option value="3">Triplets</option><option value="4">16ths</option></select>
      </div>
      <details>
        <summary>Speed builder</summary>
        <div class="stack">
          <div class="row"><button class="toggle" id="builder">Off</button></div>
          <div class="row"><label class="k">add</label><input type="number" id="bStep" value="4" min="1" max="20"> BPM</div>
          <div class="row"><label class="k">every</label><input type="number" id="bBars" value="4" min="1" max="32"> bars</div>
          <div class="row"><label class="k">up to</label><input type="number" id="bMax" value="100" min="1" max="100"> BPM</div>
        </div>
      </details>
    </div>
  </div>
</div>

<div id="fretbar">
  <div class="fhead"><h1 id="scaleTitle"></h1><span id="scaleSub"></span></div>
  <div class="row ctl">
    <button class="primary" id="playEx">▶ Play exercise</button>
    <select id="exType" aria-label="Exercise">
      <option value="scale">Scale run</option>
      <option value="arp">Arpeggio in position</option>
      <option value="sweep5">Sweep arpeggio · 5 strings</option>
      <option value="sweep3">Sweep arpeggio · 3 strings</option>
      <option value="sweep6">Sweep arpeggio · 6 strings</option>
      <option value="tap">Tapping arpeggio · one string</option>
      <option value="tapx">Tapping arpeggio · string skipping</option>
    </select>
    <select id="pattern" aria-label="Pattern"><option value="1">Straight</option><option value="3">Groups of 3</option><option value="4">Groups of 4</option></select>
    <select id="degree" aria-label="Arpeggio degree" hidden></select>
    <label class="k" for="pos">Position</label><input type="range" id="pos" min="0" max="12" value="5" step="1"><span id="posShow" class="k"></span>
    <select id="view" aria-label="Fretboard view">
      <option value="full">View: whole scale</option>
      <option value="tonics">View: tonics only</option>
      <option value="box">View: position box</option>
      <option value="chord">View: background chord</option>
      <option value="parallel">View: changes vs major</option>
      <option value="modes">View: mode names</option>
    </select>
    <select id="labels" aria-label="Labels"><option value="deg">Degrees</option><option value="note">Notes</option></select>
    <select id="sound" aria-label="Sound"><option value="nylon">Sound: classical nylon</option><option value="glass">Sound: glass</option><option value="felt">Sound: felt keys</option><option value="harp">Sound: soft harp</option></select>
    <span class="now" id="now"></span>
  </div>
  <details id="tabBox" open><summary>Tablature</summary><div id="tab" class="tab"></div></details>
  <div class="fretscroll"><svg id="fret" viewBox="0 0 1200 196" role="img" aria-label="Fretboard"></svg></div>
  <div class="legend">
    <span><i class="r"></i>Tonic</span>
    <span><i class="rel"></i><span id="relLegend">Relative tonic</span></span>
    <span><i class="n"></i>Scale note</span>
    <span><i class="c"></i>Color note</span>
    <span><i class="o"></i>Chord tone outside the scale</span>
    <span id="viewHint"></span>
    <span class="keys">Click any fret to hear it · Space metronome · Enter exercise · ↑ ↓ tempo · ← → position</span>
  </div>
</div>
</div><!-- #app -->

<script>
// ---------------------------------------------------------------------------------------------
// Dados musicais (textos de teoria escritos por nós). rel: tônica relativa (intervalo a partir da tônica)
// ---------------------------------------------------------------------------------------------
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const DEG = { 0: '1', 1: 'b2', 2: '2', 3: 'b3', 4: '3', 5: '4', 6: '#4', 7: '5', 8: 'b6', 9: '6', 10: 'b7', 11: '7' };
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
// os sete modos são a mesma escala maior começando em graus diferentes
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const MODE_NAMES = ['Ionian', 'Dorian', 'Phrygian', 'Lydian', 'Mixolydian', 'Aeolian', 'Locrian'];
const MODE_SHORT = ['Ion', 'Dor', 'Phr', 'Lyd', 'Mix', 'Aeo', 'Loc'];
const SCALES = [
  { name: 'Lydian', arp: { suf: 'maj7#11', ivs: [0, 4, 7, 11, 6] }, mode: 3, steps: [0, 2, 4, 6, 7, 9, 11], color: 6, vamp: [0, 1],
    rel: { iv: 7, label: 'Parent major', how: '4th mode of' },
    mood: 'Dreamy, floating, a little magical. Major, but with a raised 4th that never quite lands.',
    use: 'Over a major chord, especially the I to II major vamp. The II chord is where the #4 lives.',
    tip: 'Let the #4 ring with a slow, wide vibrato and resolve it up to the 5th. That one note carries the whole color of the mode.' },
  { name: 'Ionian (Major)', arp: { suf: 'maj7', ivs: [0, 4, 7, 11] }, mode: 0, steps: [0, 2, 4, 5, 7, 9, 11], color: 11, vamp: [0, 3],
    rel: { iv: 9, label: 'Relative minor', how: 'shares its notes with' , rname: 'minor' },
    mood: 'Bright, stable, resolved. The reference every other mode is compared to.',
    use: 'Over major chords and I–IV–V progressions.',
    tip: 'The 4th clashes with the major chord: pass through it and lean on the 3rd, 5th and 7th.' },
  { name: 'Dorian', arp: { suf: 'm6', ivs: [0, 3, 7, 9] }, mode: 1, steps: [0, 2, 3, 5, 7, 9, 10], color: 9, vamp: [0, 3],
    rel: { iv: 10, label: 'Parent major', how: '2nd mode of' },
    mood: 'Minor but hopeful, soulful, a touch of funk.',
    use: 'Over minor 7th chords and the i to IV vamp.',
    tip: 'The natural 6th is the color. Bend into it from the 5th to make the minor sound lift.' },
  { name: 'Phrygian', arp: { suf: 'm(b9)', ivs: [0, 3, 7, 1] }, mode: 2, steps: [0, 1, 3, 5, 7, 8, 10], color: 1, vamp: [0, 1],
    rel: { iv: 8, label: 'Parent major', how: '3rd mode of' },
    mood: 'Dark, exotic, Spanish and metal at the same time.',
    use: 'Over minor chords with a bII, heavy riffs on the low string.',
    tip: 'Trill between the tonic and the b2. Two notes a half step apart already sound like the mode.' },
  { name: 'Mixolydian', arp: { suf: '7', ivs: [0, 4, 7, 10] }, mode: 4, steps: [0, 2, 4, 5, 7, 9, 10], color: 10, vamp: [0, 6],
    rel: { iv: 5, label: 'Parent major', how: '5th mode of' },
    mood: 'Major with attitude: rock, blues and swagger.',
    use: 'Over dominant 7th chords and the I to bVII vamp.',
    tip: 'Mix it with the minor pentatonic: the b7 is the bridge between the two.' },
  { name: 'Aeolian (Natural minor)', arp: { suf: 'm(b6)', ivs: [0, 3, 7, 8] }, mode: 5, steps: [0, 2, 3, 5, 7, 8, 10], color: 8, vamp: [0, 5],
    rel: { iv: 3, label: 'Relative major', how: 'shares its notes with', rname: 'major' },
    mood: 'Sad, epic, cinematic.',
    use: 'Over minor chords and i to bVI to bVII progressions.',
    tip: 'The b6 is the tear in the voice. Land on it, then fall to the 5th.' },
  { name: 'Locrian', arp: { suf: 'm7b5', ivs: [0, 3, 6, 10] }, mode: 6, steps: [0, 1, 3, 5, 6, 8, 10], color: 6, vamp: [0, 1], names: { 6: 'b5' },
    rel: { iv: 1, label: 'Parent major', how: '7th mode of' },
    mood: 'Unstable, tense, like the floor is missing.',
    use: 'Over half-diminished chords (m7b5), or as a short moment of tension.',
    tip: 'The b5 makes the tonic feel unsafe. Use it for drama, not for a whole solo.' },
  { name: 'Harmonic minor', arp: { suf: 'm(maj7)', ivs: [0, 3, 7, 11] }, steps: [0, 2, 3, 5, 7, 8, 11], color: 11, vamp: [0, 4],
    rel: { iv: 3, label: 'Relative major', how: 'is the minor key of', rname: 'major' },
    mood: 'Neoclassical, mysterious, a little sinister.',

// escala tocável de verdade, do Mi grave ao mi agudo.
// 7 e 8 notas (modos, menores, diminuta, bebop) e tons inteiros: EM POSIÇÃO, a mão parada com um dedo por casa
// (indicador na casa da posição, 4 casas) e no máximo uma casa esticada com o indicador ou o mínimo.
// Pentatônicas: o box, 2 notas por corda; blues: o box + a nota de passagem (meio tom) como 3ª.
// em cada corda os dedos sobem junto com as casas: se duas casas diferentes caem no mesmo dedo, a de cima passa
// para o dedo seguinte (e, se passar do mínimo, as de baixo recuam). Corda solta é 0.
function orderFingers(notes) {
  for (let s = 0; s < 6; s++) {
    const frets = [...new Set(notes.filter(x => x.s === s && x.f > 0).map(x => x.f))].sort((a, b) => a - b);
    if (!frets.length) continue;
    const want = new Map(notes.filter(x => x.s === s && x.f > 0).map(x => [x.f, x.fg || 1]));
    const fg = frets.map(f => want.get(f));
    for (let i = 1; i < fg.length; i++) if (fg[i] <= fg[i - 1]) fg[i] = fg[i - 1] + 1;
    if (fg[fg.length - 1] > 4) { fg[fg.length - 1] = 4; for (let i = fg.length - 2; i >= 0; i--) fg[i] = Math.min(fg[i], fg[i + 1] - 1); }
    const map = new Map(frets.map((f, i) => [f, Math.max(1, fg[i])]));
    notes.forEach(x => { if (x.s === s && x.f > 0) x.fg = map.get(x.f); });
  }

    lines.forEach(l => { o += `<polyline points="${l.map(n => fx(n.f) + ',' + sy(n.s)).join(' ')}" fill="none" stroke="#e0b04a" stroke-width="3" stroke-opacity=".55" stroke-linejoin="round" stroke-linecap="round"/>`; });
    const a = path[0];
    o += `<circle cx="${fx(a.f)}" cy="${sy(a.s)}" r="17" fill="none" stroke="#e0b04a" stroke-width="1.2" stroke-dasharray="2 3"/>`;
  }
  for (let f = 1; f <= FRETS; f++) o += `<text x="${FB.x0 + (f - 0.5) * FB.fw}" y="190" fill="#9aa0a8" font-size="12" text-anchor="middle" font-family="${FONT}">${f}</text>`;
  TUNING.forEach((open, s) => {
    for (let f = 0; f <= FRETS; f++) {
      const m = open + f, iv = mod12(m - S.key), outside = !S.scale.steps.includes(iv);
      if (outside && !extra.has(mod12(m))) continue;
      const isRoot = iv === 0, isRel = iv === rel, isColor = iv === S.scale.color;
      const act = active && active.s === s && active.f === f, arp = inSeq.has(s + ':' + f);
      let dim = arpOn && !arp && !act;
      const pc = mod12(m), owner = outside ? [curArp, ref].find(c => c && c.pcs.includes(pc)) : null;
      let label = S.labels === 'deg' ? (outside ? DEG[iv] : deg(iv)) : owner ? spell(pc, owner.roles[owner.pcs.indexOf(pc)]) : noteAt(pc);
      let hide = false, altered = false;
      const run = inRun.has(s + ':' + f);

      const keep = scaleMode && run, chordTone = keep && view === 'chord' && ref.pcs.includes(pc);
      if (keep) { /* nenhuma visão apaga nem renomeia uma nota do desenho */ }
      else if (scaleMode && view === 'box') hide = !act;
      else if (view === 'tonics') hide = !isRoot && !isRel && !act && !arp && !run; // as notas do arpejo nunca somem

      else if (altered) shape = `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(177,140,240,.4)" stroke="${VIO}" stroke-width="2"/>`;
      else shape = `<circle cx="${x}" cy="${y}" r="${r}" fill="${arp ? 'rgba(224,176,74,.25)' : '#1d2024'}" stroke="${isColor ? VIO : ACC}" stroke-width="${arp ? 2.4 : 1.6}"/>`;

        <text x="${x}" y="${y + (label.length > 2 ? 3.4 : 4.2)}" font-size="${label.length > 2 ? 8.5 : 11}" font-weight="700" text-anchor="middle" fill="${txt}" font-family="${FONT}">${label}</text>${arp ? fingerBadge(x, y, finger(s, f), FONT) : run && S.view !== 'tonics' ? fingerBadge(x, y, runFinger(s, f), FONT) : ''}</g>`;

      o += `<g opacity="${inBox(f) ? 0.85 : 0.16}"><circle cx="${fx(f)}" cy="${sy(s)}" r="10" fill="none" stroke="${ACC}" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="${fx(f)}" y="${sy(s) + 4}" font-size="10" text-anchor="middle" fill="#9aa0a8" font-family="${FONT}">${DEG[iv]}</text></g>`;

  $('fret').innerHTML = o;
  drawTab(arpOn);
  // nome da escala em destaque acima do braço; no arpejo, o acorde que está soando
  $('scaleTitle').innerHTML = `<b>${keyName(S.key)}</b> ${S.scale.name}`;
  $('scaleSub').innerHTML = curArp ? `Arpeggio: <b>${curArp.name}</b> (${curArp.roles.join(' ')})` : `${S.scale.steps.map(iv => deg(iv)).join(' ')}`;
  const hints = { full: '', tonics: 'Only the home notes: find the tonic and the relative tonic anywhere on the neck.',
    box: 'One hand position: everything you can reach without shifting.',
    chord: scaleMode ? `White ring: notes of the background chord ${ref.name} (${ref.roles.join(' ')}). Every note of the scale shape stays lit.` : `Chord tones of ${ref.name}: ${ref.roles.join(' ')}. Dashed notes are chord tones outside the scale.`,

  $('viewHint').textContent = arpOn ? `Fingers: 1 index · 2 middle · 3 ring · 4 pinky · 0 open string · T right-hand tap. The line is the arpeggio shape, starting at the dashed ring. ${hints[view]}` : hints[view];

$('fret').addEventListener('pointerdown', e => {
  const svg = $('fret'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;

const chordName = d => chordLabel(degChord(d));
function modeMap() { // as 7 notas do tom de origem, com o modo que começa em cada uma
  const sc = S.scale; if (sc.mode === undefined) return '';
  const parent = mod12(S.key - MAJOR[sc.mode]);
  const chips = MAJOR.map((iv, k) => `<button data-k="${k}" class="${k === sc.mode ? 'cur' : ''}${k === 0 ? ' parent' : ''}">${(FLAT_KEYS.has(parent) ? FLATS : NOTES)[(parent + iv) % 12]}<small>${MODE_SHORT[k]}</small></button>`).join('');
  return `<p class="maphint">Same notes as <b>${keyName(parent)} major</b>. Starting on <b>${keyName(S.key)}</b> makes it ${MODE_NAMES[sc.mode]}. Tap a note to hear the same notes as another mode.</p><div class="modemap">${chips}</div>`;
}
function vsMajor() { // o que muda em relação à escala maior com a mesma tônica
  const sc = S.scale, extra = sc.steps.filter(iv => !MAJOR.includes(iv)), missing = MAJOR.filter(iv => !sc.steps.includes(iv));
  const digit = l => l.replace(/[#b]/g, '');
  const parts = [], used = new Set();
  extra.forEach(iv => { const l = deg(iv), mi = missing.find(x => !used.has(x) && digit(DEG[x]) === digit(l)); if (mi !== undefined) { used.add(mi); parts.push(`${l} instead of ${DEG[mi]}`); } else parts.push(`adds ${l}`); });
  missing.filter(x => !used.has(x)).forEach(x => parts.push(`no ${DEG[x]}`));

    ${modeMap()}

// faixa de 0 a 100 BPM (pedido do usuário)
function setBpm(v) { S.bpm = Math.max(0, Math.min(100, Math.round(v))); $('bpm').value = S.bpm; $('bpmShow').textContent = S.bpm; }
// posições: cada uma começa num grau da escala na corda Mi grave (a nota de passagem da blues e da bebop não abre posição).
// O controle anda de posição em posição, subindo o braço grau a grau.
function posFrets() {
  const set = S.scale.steps.filter(iv => iv !== S.scale.passing), out = [];
  for (let f = 0; f <= 13; f++) if (set.includes(mod12(TUNING[0] + f - S.key))) out.push(f);
  return out;
}
function syncPos(target = S.pos) {

  S.pos = fr[i]; $('pos').max = fr.length - 1; $('pos').value = i;
  showPos();
}
function showPos() {
  const set = S.scale.steps.filter(iv => iv !== S.scale.passing), iv = mod12(TUNING[0] + S.pos - S.key);
  // nos 7 modos, a posição que começa no grau k tem o desenho do modo que começa ali (ex.: do 2º grau da maior = dórico)
  const shape = S.scale.mode !== undefined ? ` · ${MODE_NAMES[(S.scale.mode + set.indexOf(iv)) % 7]} shape` : '';
  $('posShow').textContent = `Pos ${set.indexOf(iv) + 1}/${set.length} · from ${deg(iv)}${shape} · fret ${S.pos}`;
}

// trilha de fundo independente: Play/Stop próprio e relógio próprio, sem depender do metrônomo nem dos exercícios
// cada acorde dura os compassos indicados no andamento atual; em 0 BPM o acorde fica parado
let padTimer = null, padStep = 0;

}

$('tap').onclick = tap;
addEventListener('keydown', e => {
  if (document.activeElement && ['INPUT', 'SELECT'].includes(document.activeElement.tagName) && !['Space', 'Enter'].includes(e.code)) return;
  if (e.code === 'Space') { e.preventDefault(); S.running ? stop() : start(); }
  else if (e.code === 'Enter') { e.preventDefault(); toggleExercise(); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); setBpm(S.bpm + (e.shiftKey ? 5 : 1)); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); setBpm(S.bpm - (e.shiftKey ? 5 : 1)); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); stepPos(1); } // próxima posição da escala
  else if (e.code === 'ArrowLeft') { e.preventDefault(); stepPos(-1); }
  else if (e.code === 'KeyT') tap();
});

      { id: 'bl4', t: 'Mixing major and minor', key: 'A', scale: 'Major blues', pos: 2, ex: 'scale', view: 'box', bpm: 60, prog: B12,
        why: "Real blues players blend both sides: the b3 hammered or bent into the 3 is the most bluesy move there is. The major blues scale (1 2 b3 3 5 6) puts that move inside one scale.",
        how: ["Find every b3–3 pair: they sit side by side, one fret apart.", "Hammer the b3 onto the 3 and resolve to the tonic.", "Over D7 (the IV), lean on the b3 of A (C): it is the b7 of D7."],
        goal: "Play b3–3–1 in three different places on the neck." },
      { id: 'bl5', t: 'Follow the chords: dominant 7 arpeggios', key: 'A', scale: 'Minor pentatonic', pos: 4, ex: 'arp', src: -3, view: 'chord', bpm: 60, prog: B12,
        why: "Scales give you notes; arpeggios give you the chord. A7, D7 and E7 as arpeggios in one position show where each chord lives, so your lines can land on the 3rd of each chord as it changes. The dashed notes are chord tones the pentatonic doesn't have.",
        how: ["Play the arpeggio exercise: it walks through the 12-bar chords in order.", "Start the background and watch the chord tones change on the fretboard.", "Improvise with the pentatonic, but land on the 3rd of each chord (C#, F#, G#) on beat 1 of every change."],
        goal: "Hit the 3rd of every chord change through one 12-bar chorus." },
      { id: 'bl6', t: 'Mixolydian and the 9th sound', key: 'A', scale: 'Mixolydian', pos: 4, ex: 'scale', bpm: 60, prog: [[0, '9', 4], [5, '9', 4]],
        why: "Mixolydian (1 2 3 4 5 6 b7) is the scale of a dominant chord. It adds the 2 (the 9th) and the 6 (the 13th): the jazzy colors of uptown blues.",
        how: ["Play the run and find the 9 (B) and the 6 (F#).", "Over A9, play lines that climb 3–5–b7–9.", "Over D9, notice the same notes now stress different chord tones."],
        goal: "Make a phrase that ends on the 9th (B) over A9." },
      { id: 'bl7', t: 'Minor blues', key: 'A', scale: 'Minor pentatonic', pos: 5, ex: 'arp', src: -3, view: 'chord', bpm: 60, prog: MB12,
        why: "In a minor blues (Am7, Dm7, F7, E7) the minor pentatonic fits almost everything. The E7 brings in G#, the leading tone that pulls back to A: following the arpeggios shows exactly where the scale stops working.",
        how: ["Play the arpeggios through the form.", "Over F7, find the Eb (the blue note of A) inside the chord.", "Over E7, play G# and resolve it up to A."],
        goal: "One chorus with the pentatonic, resolving G# to A on every E7." },
    ] },
  { id: 'rock', name: 'Rock', intro: "Riffs, anthems and speed. From pentatonic riffs in open E to natural and harmonic minor, then sequences for speed and sweep-picked arpeggios.",
    lessons: [
      { id: 'rk1', t: 'Pentatonic riffs in open E', key: 'E', scale: 'Minor pentatonic', pos: 0, ex: 'scale', view: 'box', bpm: 70, prog: [[0, '5', 2], [10, '5', 1], [5, '5', 1]],
        why: "Rock riffs live on the low strings in open E: the open 6th string is the tonic, and the minor pentatonic (E G A B D) gives classic hard rock its weight.",
        how: ["Play the run starting from the open low E.", "Write a two-bar riff using only the 6th and 5th strings.", "Play it over the power chords E5, D5 and A5 in the background."],
        goal: "An 8-note riff repeated four times in time at 80 BPM." },
      { id: 'rk2', t: 'The five pentatonic shapes', key: 'E', scale: 'Minor pentatonic', pos: 0, ex: 'scale', view: 'box', bpm: 60, prog: [[0, 'm7', 4]],
        why: "The same five notes repeat in five overlapping shapes up the neck. Knowing them all frees you from one box and lets you solo anywhere.",
        how: ["Play the run in the open position, then press → (or move the Position slider one step) to go to the next shape. Each step starts on the next note of the scale on the low E string.", "In each window, find the tonics first: the shape hangs around them.", "Pick two neighbouring shapes and slide between them on one string."],
        goal: "Play all five positions in a row, from the open position up to the 12th fret, without stopping the metronome." },
      { id: 'rk3', t: 'Natural minor for melodic solos', key: 'E', scale: 'Aeolian (Natural minor)', pos: 7, ex: 'scale', bpm: 60, prog: [[0, 'm', 2], [8, '', 1], [10, '', 1]],
        why: "Add the 2 (F#) and the b6 (C) to the pentatonic and you get natural minor, the sound of epic rock ballads. The b6 is the emotional note.",
        how: ["Find the 2 and the b6: the two notes the pentatonic was missing.", "Over C (the bVI), land on C or E.", "Over D (the bVII), land on D or F#."],
        goal: "Write a 4-bar melody you can sing, then play it over the progression." },
      { id: 'rk4', t: 'Speed sequences: groups of 3 and 4', key: 'A', scale: 'Minor pentatonic', pos: 5, ex: 'scale', pattern: 3, view: 'box', bpm: 50, subdiv: 4, prog: [[0, 'm7', 4]],
        why: "Sequences turn a scale into a lick. Groups of 3 and 4 are the classic rock patterns: they build alternate picking and make any scale sound fast and organized.",
        how: ["Groups of 3 at 50 BPM in 16ths, alternate picking.", "Switch Pattern to Groups of 4.", "Open the Speed builder and turn it on: +4 BPM every 4 bars, up to 90."],
        goal: "Groups of 4 in 16ths at 80 BPM, clean and even." },
      { id: 'rk5', t: 'Mixolydian rock', key: 'A', scale: 'Mixolydian', pos: 4, ex: 'scale', bpm: 70, prog: [[0, '', 2], [10, '', 1], [5, '', 1]],
        why: "Major-key rock built on I–bVII–IV is Mixolydian: the b7 (G) gives classic rock anthems their swagger.",
        how: ["Play the run and find the 3 (C#) and the b7 (G).", "Over G, land on G or D.", "Borrow the b3 (C) from the pentatonic and bend it up to C#."],
        goal: "A solo that clearly outlines A, G and D." },
      { id: 'rk6', t: 'Harmonic minor: neoclassical rock', key: 'A', scale: 'Harmonic minor', pos: 5, ex: 'scale', pattern: 4, bpm: 50, subdiv: 4, prog: [[0, 'm', 2], [7, '7', 2]],
        why: "Raising the 7th of natural minor (G to G#) creates a major V chord (E7) and the exotic b6–7 jump. Neoclassical players use it for classical-sounding runs.",
        how: ["Find the b6 (F) and the 7 (G#): three frets apart.", "Play the groups of 4 over Am, then over E7.", "Over E7, target G# and resolve it to A when Am returns."],
        goal: "Groups of 4 at 70 BPM, resolving G# to A at every change." },
      { id: 'rk7', t: '3-string sweep arpeggios', key: 'A', scale: 'Aeolian (Natural minor)', pos: 5, ex: 'sweep3', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, 'm', 1], [10, '', 1], [8, '', 1], [7, '', 1]],
        why: "Sweep picking plays one note per string in a single pick motion, like a slow strum. Triads on three strings make the motion easy to control. The E chord borrows G# from harmonic minor (dashed).",
        how: ["Play slowly: one note per string going up, then roll back down.", "Lift each finger as you leave a note so the notes don't ring together like a chord.", "Raise the tempo only when every note is clean."],
        goal: "Am–G–F–E as triplet sweeps at 60 BPM." },
      { id: 'rk8', t: '5-string sweeps', key: 'A', scale: 'Harmonic minor', pos: 5, ex: 'sweep5', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, 'm', 1], [5, 'm', 1], [7, '', 1], [0, 'm', 1]],
        why: "Five-string sweeps cover two octaves in one gesture: the signature of neoclassical shred. Harmonic minor gives the progression its dramatic E major chord.",
        how: ["Learn each shape on its own at 40 BPM.", "Keep the pick moving in one direction across the strings.", "Connect the shapes with the background on."],
        goal: "The whole progression at 60 BPM in triplets." },
    ] },
  { id: 'jazz', name: 'Jazz', intro: "Playing the changes. Jazz lines are built from chord tones, so this path is arpeggio-first: the four 7th chords, the ii–V–I, guide tones, bebop lines and altered dominants.",
    lessons: [
      { id: 'jz1', t: 'The four 7th chords', key: 'C', scale: 'Ionian (Major)', pos: 7, ex: 'arp', src: -3, view: 'chord', bpm: 60, prog: [[0, 'maj7', 1], [0, '7', 1], [0, 'm7', 1], [0, 'm7b5', 1]],
        why: "Jazz harmony is built on four 7th-chord types. Playing all four from the same root shows how changing one note (the 3rd, 5th or 7th) changes the whole color.",
        how: ["Play the arpeggios: maj7 (1 3 5 7), 7 (1 3 5 b7), m7 (1 b3 5 b7), m7b5 (1 b3 b5 b7).", "Watch the labels: only one note moves from each chord to the next.", "Sing each arpeggio while you play it."],
        goal: "Name and play all four types from C without the screen." },
      { id: 'jz2', t: 'ii–V–I arpeggios', key: 'C', scale: 'Ionian (Major)', pos: 7, ex: 'arp', src: -3, view: 'chord', bpm: 60, prog: IIVI,
        why: "ii–V–I (Dm7–G7–Cmaj7) is the most common progression in jazz. Arpeggios in one position are the first step to playing through the changes instead of over them.",
        how: ["Play the arpeggio exercise, each chord starting on its root.", "Now start each chord on its 3rd instead.", "With the background on, connect each chord to the next by the nearest note."],
        goal: "Play through the ii–V–I with arpeggios, no gaps, at 80 BPM in eighths." },
      { id: 'jz3', t: 'Guide tones: 3rds and 7ths', key: 'C', scale: 'Ionian (Major)', pos: 7, ex: 'scale', view: 'chord', bpm: 60, prog: IIVI,
        why: "The 3rd and 7th define each chord, and in a ii–V–I they move by step: F (b3 of Dm7) stays as the b7 of G7 and falls to E (3 of Cmaj7); C (b7 of Dm7) falls to B (3 of G7) and stays as the 7 of Cmaj7.",
        how: ["Start the background and watch the chord labels.", "Play only the 3rd and 7th of each chord, as long notes.", "Fill in with scale notes, arriving on a guide tone on each beat 1."],
        goal: "A line that lands on a 3rd or 7th at every chord change." },
      { id: 'jz4', t: 'The bebop dominant scale', key: 'G', scale: 'Bebop dominant', pos: 2, ex: 'scale', bpm: 60, prog: [[7, 'm7', 1], [0, '7', 1]],
        why: "Adding a passing major 7 to Mixolydian makes an 8-note scale. Run down it in eighths from a chord tone on the beat and every downbeat lands on a chord tone of G7: the core of the bebop sound.",
        how: ["Start on G on beat 1 and descend in eighths: G, F, D and B fall on the beats.", "Try starting on B, D or F.", "Play it over Dm7–G7: the same line works over both chords."],
        goal: "Descending bebop lines from all four chord tones of G7." },
      { id: 'jz5', t: 'Minor ii–V–i', key: 'C', scale: 'Harmonic minor', pos: 7, ex: 'arp', src: -3, view: 'chord', bpm: 60, prog: [[2, 'm7b5', 1], [7, '7b9', 1], [0, 'm(maj7)', 2]],
        why: "In minor keys the ii–V becomes Dm7b5–G7b9. All three chords come from C harmonic minor, so one scale covers the progression and the arpeggios show its strongest notes.",
        how: ["Play the arpeggios through the progression.", "Over G7b9, find the b9 (Ab) and resolve it down to G.", "Resolve B (the 3rd of G7) up to C on the i chord."],
        goal: "A line through the minor ii–V–i that resolves B to C." },
      { id: 'jz6', t: 'Upper extensions: 9th arpeggios', key: 'C', scale: 'Ionian (Major)', pos: 7, ex: 'arp', src: -3, view: 'chord', bpm: 60, prog: [[2, 'm9', 1], [7, '9', 1], [0, 'maj9', 2]],
        why: "Start an arpeggio on the 3rd of a chord and you get 3, 5, 7 and 9: a 7th chord sitting on top of the chord. Over Dm7 that is Fmaj7, over G7 it is Bm7b5, over Cmaj7 it is Em7.",
        how: ["Play the 9th arpeggios.", "Now play only the top four notes of each one (3 5 7 9).", "Improvise with those upper arpeggios over the background."],
        goal: "Fmaj7, Bm7b5 and Em7 arpeggios over Dm7–G7–Cmaj7." },
      { id: 'jz7', t: 'The altered dominant', key: 'G', scale: 'Altered', pos: 2, ex: 'scale', bpm: 50, prog: [[0, '7#9', 2], [5, 'maj7', 2]],
        why: "Over a V7 that resolves, jazz players raise the tension with the altered scale: b9, #9, #11 and b13 all at once. It is the 7th mode of Ab melodic minor.",
        how: ["Find the 3 (B) and the b7 (F): the anchors of the chord.", "Play the run over G7#9, then resolve to the nearest note of Cmaj7 (C, E, G, B) when the chord changes.", "Try the half-step resolutions Eb to E and Ab to G."],
        goal: "Tension on G7, clean resolution on Cmaj7, four times in a row." },
      { id: 'jz8', t: 'Half-whole diminished', key: 'G', scale: 'Diminished (half-whole)', pos: 2, ex: 'scale', pattern: 3, bpm: 50, prog: [[0, '7b9', 2], [5, 'maj7', 2]],
        why: "The half-whole scale (1 b2 #2 3 #4 5 6 b7) fits a 7b9 chord perfectly and repeats every three frets, so any lick moved up a minor third still fits.",
        how: ["Play the run in groups of 3.", "Take a 4-note lick and move it up 3 frets: it still fits.", "Resolve to Cmaj7 when the background changes."],
        goal: "One lick in four positions, 3 frets apart, over G7b9." },
    ] },
  { id: 'fusion', name: 'Fusion', intro: "Modal colors over static grooves: Dorian, Lydian, melodic minor and its modes, superimposed pentatonics and symmetrical scales.",
    lessons: [
      { id: 'fu1', t: 'The Dorian vamp', key: 'E', scale: 'Dorian', pos: 7, ex: 'scale', bpm: 60, subdiv: 4, prog: [[0, 'm7', 2], [5, '7', 2]],
        why: "The i–IV vamp (Em7–A7) is the classic fusion and jazz-funk groove. Dorian's natural 6 (C#) is the 3rd of A7, so one scale ties both chords together.",
        how: ["Play the run in 16ths.", "Over A7, lean on C#.", "Over Em7, lean on B and D."],
        goal: "16th-note lines at 70 BPM that stress C# on A7." },
      { id: 'fu2', t: 'Superimposed pentatonics', key: 'B', scale: 'Minor pentatonic', pos: 7, ex: 'scale', view: 'chord', bpm: 60, prog: [[5, 'm9', 4]],
        why: "B minor pentatonic over Em9 gives the 5, b7, root, 9 and 11 of the chord: an open, modern sound with no wrong notes. This is how fusion players sound inside but fresh.",
        how: ["Read the labels: they show what each B pentatonic note is against Em9.", "Play familiar pentatonic licks in this box over the background.", "End your phrases on F#, the 9th of the chord, instead of E."],
        goal: "A phrase over Em9 built only from B minor pentatonic that ends on the 9th." },
      { id: 'fu3', t: 'Lydian: the dreamy major', key: 'D', scale: 'Lydian', pos: 4, ex: 'scale', bpm: 60, prog: [[0, 'maj7', 2], [2, '', 2]],
        why: "Lydian is major with a #4 (G#), the floating sound of ambient fusion. Over Dmaj7–E the G# is also the 3rd of E, so the color note keeps sounding right.",
        how: ["Find the #4 (G#) everywhere in the window.", "Play D–E–F#–G#–A slowly, holding the G#.", "Over E, land on G#; over Dmaj7, land on C# or A."],
        goal: "A melody where the #4 is the longest note." },
      { id: 'fu4', t: 'Melodic minor', key: 'A', scale: 'Melodic minor', pos: 5, ex: 'scale', bpm: 60, prog: [[0, 'm6', 2], [0, 'm(maj7)', 2]],
        why: "Melodic minor (1 2 b3 4 5 6 7) is the backbone of modern fusion harmony: dark from the b3, bright from the 6 and 7.",
        how: ["Compare with Dorian: only the 7 is different (G# instead of G).", "Play phrases that run 5–6–7–1.", "Hold the major 7 (G#) over Am(maj7)."],
        goal: "Phrases that use F# and G# without sounding like harmonic minor." },
      { id: 'fu5', t: 'Lydian dominant', key: 'D', scale: 'Lydian dominant', pos: 4, ex: 'scale', bpm: 60, prog: [[0, '9', 2], [0, '7#11', 2]],
        why: "Mixolydian with a #4: a dominant chord that never needs to resolve, used everywhere in fusion and funk. It is the 4th mode of A melodic minor.",
        how: ["Find the #4 (G#) and the b7 (C).", "Switch Exercise to Arpeggio in position to hear the 7#11 arpeggio.", "Hold the #11 over D7#11."],
        goal: "A line that outlines D7 and features the #11." },
      { id: 'fu6', t: 'Whole tone', key: 'E', scale: 'Whole tone', pos: 7, ex: 'scale', pattern: 3, bpm: 60, prog: [[0, '7#5', 2], [5, 'm7', 2]],
        why: "Six notes, all a whole step apart. Over an augmented dominant (E7#5) it floats, and its symmetry makes every lick repeat two frets higher.",
        how: ["Play the run in groups of 3.", "Move any lick 2 frets up: it still fits.", "Resolve to A or C when Am7 arrives."],
        goal: "Whole-tone tension on E7#5 resolving cleanly to Am7." },
      { id: 'fu7', t: 'Phrygian dominant', key: 'E', scale: 'Phrygian dominant', pos: 0, ex: 'scale', pattern: 4, bpm: 50, subdiv: 4, prog: [[0, '', 2], [1, '', 2]],
        why: "The 5th mode of harmonic minor puts the b2 and the major 3rd side by side: the sound of flamenco, middle-eastern fusion and metal, especially over the E–F vamp.",
        how: ["Find the b2 (F) and the 3 (G#), three frets apart.", "Play groups of 4 starting on the open E.", "Over F, land on F or A; over E, land on G#."],
        goal: "Groups of 4 in 16ths at 70 BPM over the vamp." },
      { id: 'fu8', t: 'Modal sweeps: maj7#11', key: 'D', scale: 'Lydian', pos: 4, ex: 'sweep5', src: -2, bpm: 40, subdiv: 3, prog: [[0, 'maj7', 4]],
        why: "A sweep built from the modal arpeggio (1 3 5 7 #11) drops the color note right into the chord: the most fusion way to arpeggiate Lydian.",
        how: ["Learn the shape at 40 BPM.", "Listen for where the #11 lands in the shape.", "Use it as a fast fill over the background."],
        goal: "Clean 5-string maj7#11 sweeps at 60 BPM." },
    ] },
  { id: 'tapping', name: 'Tapping', intro: "Two-hand tapping arpeggios on one string: the left hand frets two chord tones, the right hand taps a higher one, and the three notes roll as tap, pull-off, hammer-on. Every lesson shows the left-hand fingers, the T for the tap, and the tab.",
    lessons: [
      { id: 'tp1', t: 'One chord, one string: E minor', key: 'E', scale: 'Aeolian (Natural minor)', pos: 5, ex: 'tap', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, 'm', 4]],
        why: "The classic tapping arpeggio: on the B string, the index frets E (5), the pinky frets G (8) and the right hand taps B (12). Three notes of E minor, played as one rolling motion.",
        how: ["Tap the 12th fret with a right-hand finger and pull it off sideways, so the index note sounds.", "Hammer the pinky onto the 8th fret without picking.", "Repeat in triplets: T-1-4, T-1-4. Mute the other strings with the side of the right hand."],
        goal: "Clean, even triplets at 70 BPM, every note the same volume." },
      { id: 'tp2', t: 'Moving the shape: i–bVI–bVII', key: 'E', scale: 'Aeolian (Natural minor)', pos: 5, ex: 'tap', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, 'm', 1], [8, '', 1], [10, '', 1], [0, 'm', 1]],
        why: "Tapping becomes music when the chord changes under it. Em, C and D each get their own three-note shape: watch which notes stay and which move.",
        how: ["Play each chord's shape on its own first, with the background on to hear the chord.", "Keep the triplets going through the changes.", "Notice that some chords move to the G string, where they fit the hand better."],
        goal: "The whole progression without stopping, at 60 BPM." },
      { id: 'tp3', t: 'Minor i–iv–V with harmonic minor', key: 'A', scale: 'Harmonic minor', pos: 5, ex: 'tap', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, 'm', 1], [5, 'm', 1], [7, '', 1], [0, 'm', 1]],
        why: "Am, Dm and E give the neoclassical sound: the E chord brings in G#, the leading tone back to A.",
        how: ["Find the G# inside the E shape.", "Play each chord twice, then once.", "Let the last Am ring."],
        goal: "Am–Dm–E–Am at 60 BPM in triplets." },
      { id: 'tp4', t: 'Major triads: I–IV–V', key: 'G', scale: 'Ionian (Major)', pos: 3, ex: 'tap', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, '', 1], [5, '', 1], [7, '', 1], [0, '', 1]],
        why: "The same technique with major triads (1 3 5) sounds bright and anthemic instead of dark.",
        how: ["Compare a major shape with the minor ones: the 3rd is one fret higher.", "Keep the tapping hand relaxed: the tap is a quick flick, not a press.", "Try 16ths when triplets feel easy."],
        goal: "G–C–D–G clean at 60 BPM." },
      { id: 'tp5', t: 'Diminished 7: the shape that repeats', key: 'A', scale: 'Harmonic minor', pos: 4, ex: 'tap', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[11, 'dim7', 1], [2, 'dim7', 1], [5, 'dim7', 1], [0, 'm', 1]],
        why: "A diminished 7 chord is four notes a minor third apart, so G#dim7, Bdim7 and Ddim7 have the same four notes: one tapping shape covers all three, only the bass changes. Resolve to Am at the end.",
        how: ["Watch the fretboard: the shape does not move while the chord name changes.", "Press → until the position is three frets higher: the same shape appears again, because the chord repeats every minor third.", "Listen for the tension resolving on Am."],
        goal: "The three dim7 shapes and the Am resolution at 60 BPM." },
      { id: 'tp6', t: '7th chords: ii–V–I', key: 'C', scale: 'Ionian (Major)', pos: 5, ex: 'tap', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: IIVI,
        why: "Tapping three notes of each 7th chord (Dm7, G7, Cmaj7) gives a smooth, jazzy cascade over the most common progression in jazz.",
        how: ["Read the degree labels: each shape picks three of the four chord tones.", "Play with the background on and land each shape on beat 1.", "Try the same with Arpeggio in position to see the full chords."],
        goal: "Through the ii–V–I without a gap at 60 BPM." },
      { id: 'tp7', t: 'Lydian modal tapping', key: 'E', scale: 'Lydian', pos: 7, ex: 'tap', src: -2, bpm: 40, subdiv: 3, prog: [[0, 'maj7', 2], [2, '', 2]],
        why: "Tapping from the modal arpeggio (1 3 5 7 #11) puts the color note in the shape: a floating, Lydian sound.",
        how: ["Find where the #11 (A#) lands in the shape.", "Let the tapped note ring a little longer.", "Move the position slider and find the shape in another place."],
        goal: "A tapped Lydian phrase that ends on the #11." },
      { id: 'tp8', t: 'String skipping: add9 across three strings', key: 'C', scale: 'Ionian (Major)', pos: 8, ex: 'tapx', src: -3, view: 'chord', bpm: 40, subdiv: 3, prog: [[0, 'add9', 2], [9, 'm(add9)', 2]],
        why: "Nuno Bettencourt's trademark: the same tap, pull-off, hammer-on on the D, G and high E strings, skipping the B string. With add9 chords (1 2 3 5) the 9th gives a wide, modern sound.",
        how: ["Play the D string group, then jump to the G string, then skip the B and land on the high E.", "Mute the strings you skip with the side of the tapping hand.", "Over Am(add9) (A B C E) compare the shapes: some notes stay, others move a step."],
        goal: "Cadd9 and Am(add9) up and down the three strings at 60 BPM in triplets." },
    ] },
  { id: 'country', name: 'Country', intro: "Bright, twangy and chord-following: major pentatonic, the country scale with its b3–3 move, triads on the top strings, 6th arpeggios and chromatic runs.",
    lessons: [
      { id: 'co1', t: 'Major pentatonic in G', key: 'G', scale: 'Major pentatonic', pos: 2, ex: 'scale', view: 'box', bpm: 70, prog: I_IV_V,
        why: "Country soloing starts with the major pentatonic (1 2 3 5 6): bright and open, and it sounds good over G, C and D when you aim for chord tones.",
        how: ["Play the run with a light, bouncy attack.", "Slide into the 3 (B) from the 2 (A).", "Over C and D, aim for the notes of those chords."],
        goal: "One 8-bar solo over G–C–D using only this scale." },
      { id: 'co2', t: 'The country scale', key: 'G', scale: 'Major blues', pos: 2, ex: 'scale', view: 'box', bpm: 70, prog: I_IV_V,

const playerById = id => { for (const g in PLAYERS) { const p = PLAYERS[g].players.find(x => x.id === id); if (p) return { g, p }; } return null; };
const playersFor = scale => { const out = []; for (const g in PLAYERS) PLAYERS[g].players.forEach(p => { if (p.items.some(it => it.scale === scale) && !out.includes(p)) out.push(p); }); return out; };
const EXNAME = { scale: 'Scale run', arp: 'Arpeggio in position', sweep3: '3-string sweep', sweep5: '5-string sweep', sweep6: '6-string sweep', tap: 'Tapping arpeggio', tapx: 'String-skipping tapping' };
const SRCNAME = { '-2': 'modal arpeggio', '-3': 'follows the chords' };
const SUBNAME = { 1: 'quarters', 2: 'eighths', 3: 'triplets', 4: '16ths' };
const PATNAME = { 1: 'straight', 3: 'groups of 3', 4: 'groups of 4' };
const VIEWNAME = { box: 'position box', chord: 'chord tones', tonics: 'tonics only' };
const store = { // só conveniências deste navegador: aba, trilha, lição atual e lições concluídas
  get(k, d) { try { const v = localStorage.getItem('pr.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pr.' + k, JSON.stringify(v)); } catch (e) {} },
};
let courseGenre = store.get('genre', 'blues'), courseSel = store.get('lesson', null);
const done = new Set(store.get('done', []));
function findLesson(id) {
  for (const g of COURSE) { const i = g.lessons.findIndex(l => l.id === id); if (i >= 0) return { g, i, L: g.lessons[i] }; }
  return null;
}
function loadLesson(L) {
  S.lesson = L;
  S.key = NOTES.indexOf(L.key); $('key').value = S.key;
  const idx = SCALES.findIndex(s => s.name === L.scale); S.scale = SCALES[idx]; $('scale').value = idx;
  S.pos = L.pos; // refreshMusic encaixa na posição da escala mais próxima
  S.exType = L.ex; $('exType').value = L.ex; syncExUi();
  S.pattern = L.pattern || 1; $('pattern').value = String(S.pattern);
  S.degree = L.src !== undefined ? L.src : -2;
  S.view = L.view || 'full'; $('view').value = S.view;
  S.subdiv = L.subdiv || 2; $('subdiv').value = String(S.subdiv);
  setBpm(L.bpm);
  refreshMusic();
}
function syncLessonBtn() { const b = $('lPlay'); if (b) b.textContent = S.exOn || S.padOn ? '■ Stop' : '▶ Play'; }
const kname = L => keyName(NOTES.indexOf(L.key));
function progText(L) { const k = NOTES.indexOf(L.key); return L.prog.map(([r, q, b]) => spell(mod12(k + r), DEG[r], k) + q + (b > 1 ? ` <small>×${b}</small>` : '')).join(' → '); }
function lessonChips(L) {
  const ex = EXNAME[L.ex] + ' · ' + (L.ex === 'scale' ? PATNAME[L.pattern || 1] : SRCNAME[String(L.src !== undefined ? L.src : -2)]);
  return [`${kname(L)} ${L.scale}`, `Position ${L.pos}`, ex, `${L.bpm} BPM · ${SUBNAME[L.subdiv || 2]}`].concat(L.view && VIEWNAME[L.view] ? [`View: ${VIEWNAME[L.view]}`] : []);
}
// pick: '' lições, 'main' escalas principais do estilo, ou o id de um guitarrista
let coursePick = store.get('pick', ''), pickItem = null;
function itemsHtml(items) {
  return `<div class="items">${items.map((it, i) => `<div class="item${pickItem === i ? ' cur' : ''}">
    <h4><span>${it.t}</span><small>${it.ex === 'scale' ? 'Scale' : 'Arpeggio'}</small></h4>
    <p class="muted">${it.note}</p>
    ${pickItem === i ? `<div class="chips">${lessonChips(it).map(c => `<span>${c}</span>`).join('')}</div><p><b>Backing</b> ${progText(it)}</p>
      <div class="row"><button class="primary" id="lPlay"></button></div>` : `<div class="row"><button data-it="${i}">Load on the fretboard</button></div>`}
  </div>`).join('')}</div>`;
}
function renderCourse() {
  const g = COURSE.find(x => x.id === courseGenre) || COURSE[0], P = PLAYERS[g.id];
  const pl = P.players.find(p => p.id === coursePick), pick = pl ? pl.id : coursePick === 'main' ? 'main' : '';
  const sel = findLesson(courseSel), cur = !pick && sel && sel.g === g ? sel : null;
  const genres = COURSE.map(x => `<button data-g="${x.id}" class="${x.id === g.id ? 'on' : ''}">${x.name} <small>${x.lessons.filter(l => done.has(l.id)).length}/${x.lessons.length}</small></button>`).join('');
  const picker = `<div class="pickrow"><select id="pick" aria-label="Guitarists and scales">
    <option value="">${g.name}: lessons</option>
    <optgroup label="Scales"><option value="main"${pick === 'main' ? ' selected' : ''}>Main scales of ${g.name.toLowerCase()}</option></optgroup>
    <optgroup label="Guitarists">${P.players.map(p => `<option value="${p.id}"${pick === p.id ? ' selected' : ''}>${p.name}</option>`).join('')}</optgroup>
  </select></div>`;
  const list = g.lessons.map((l, i) => `<button data-l="${l.id}" class="${cur && cur.L === l ? 'cur' : ''}${done.has(l.id) ? ' done' : ''}"><span class="n">${done.has(l.id) ? '✓' : i + 1}</span><span>${l.t}</span></button>`).join('');
  let detail;
  if (pick === 'main') detail = `<div class="lmeta">${g.name} · Scales and arpeggios</div><h3>Main scales of ${g.name.toLowerCase()}</h3>
    <p>The scales and arpeggios most used in ${g.name.toLowerCase()}. Load one to see it on the fretboard with its own backing chords.</p>${itemsHtml(P.main)}`;
  else if (pl) detail = `<div class="lmeta">${g.name} · Guitarist</div><h3>${pl.name}</h3><div class="chips"><span>${pl.from}</span></div>
    <p>${pl.style}</p><p class="muted">Scales and arpeggios in this player's style. Keys and chords are chosen for practice, not a transcription of a solo.</p>${itemsHtml(pl.items)}`;
  else if (!cur) detail = `<div class="lmeta">${g.lessons.length} lessons</div><h3>${g.name}</h3><p>${g.intro}</p><p class="muted">Pick a lesson: it loads its scale, position, exercise, tempo and backing chords on the fretboard. Use the menu above for the main scales of ${g.name.toLowerCase()} and the scales and arpeggios of its great guitarists.</p>`;
  else {
    const L = cur.L, who = playersFor(L.scale);
    detail = `<div class="lmeta">${g.name} · Lesson ${cur.i + 1} of ${g.lessons.length}</div><h3>${L.t}</h3>
      <div class="chips">${lessonChips(L).map(c => `<span>${c}</span>`).join('')}</div>
      ${who.length ? `<div class="who"><span class="muted">Played by</span>${who.map(p => `<button data-p="${p.id}">${p.name}</button>`).join('')}</div>` : ''}
      <p><b>Backing</b> ${progText(L)}</p>
      <p><b>Why</b> ${L.why}</p>
      <p><b>How</b></p><ol>${L.how.map(h => `<li>${h}</li>`).join('')}</ol>
      <p class="goal"><b>Goal</b> ${L.goal}</p>
      <div class="row"><button class="primary" id="lPlay"></button><button class="toggle${done.has(L.id) ? ' on' : ''}" id="lDone">✓ Done</button>${cur.i < g.lessons.length - 1 ? '<button id="lNext">Next lesson →</button>' : ''}</div>`;
  }
  $('paneCourse').innerHTML = `<div class="genres">${genres}</div>${picker}<div class="course"><div class="llist">${list}</div><div class="ldetail">${detail}</div></div>`;
  const pane = $('paneCourse');
  pane.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { courseGenre = b.dataset.g; store.set('genre', courseGenre); setPick(''); });
  pane.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { coursePick = ''; store.set('pick', ''); selectLesson(b.dataset.l); });
  pane.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const f = playerById(b.dataset.p); courseGenre = f.g; store.set('genre', courseGenre); setPick(f.p.id); });
  $('pick').onchange = e => setPick(e.target.value);
  const items = pick === 'main' ? P.main : pl ? pl.items : null;
  pane.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { pickItem = +b.dataset.it; loadLesson(items[pickItem]); renderCourse(); });
  if ($('lPlay')) {
    $('lPlay').onclick = () => {
      if (S.exOn || S.padOn) { if (S.exOn) stop(); if (S.padOn) stopPad(); }
      else { startPad(); toggleExercise(); }
    };
    syncLessonBtn();
  }
  if (cur) {
    $('lDone').onclick = () => { done.has(cur.L.id) ? done.delete(cur.L.id) : done.add(cur.L.id); store.set('done', [...done]); renderCourse(); };
    if ($('lNext')) $('lNext').onclick = () => selectLesson(g.lessons[cur.i + 1].id);
  }
}
function setPick(v) { coursePick = v; pickItem = null; store.set('pick', v); renderCourse(); }
function selectLesson(id) {
  const f = findLesson(id); if (!f) return;
  courseSel = id; courseGenre = f.g.id; store.set('lesson', id); store.set('genre', courseGenre);
  loadLesson(f.L); renderCourse();
}
function setTab(t) {
  $('paneTheory').hidden = t !== 'theory'; $('paneCourse').hidden = t !== 'course';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  store.set('tab', t);
  if (t === 'course') renderCourse();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

buildBeats(); syncPos(); drawTheory(); buildSeq();
if (courseSel && findLesson(courseSel)) loadLesson(findLesson(courseSel).L); // volta para a última lição aberta
setTab(store.get('tab', 'theory'));
requestAnimationFrame(draw);
</script>
</body>
</html>
